name: Capital Threaded Tick Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/threaded_tick_probe.py"
      - ".github/workflows/threaded-tick-probe.yml"

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Thread-separated SKCOM tick probe
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python tools/threaded_tick_probe.py
