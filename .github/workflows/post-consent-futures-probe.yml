name: Capital Post Consent Futures Probe
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/post_consent_futures_probe.py"
      - ".github/workflows/post-consent-futures-probe.yml"
jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify futures access after API consent
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python tools/post_consent_futures_probe.py
