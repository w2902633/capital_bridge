name: Capital Legacy Monitor Probe
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/legacy_monitor_probe.py"
      - ".github/workflows/legacy-monitor-probe.yml"
jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe legacy EnterMonitor path
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python tools/legacy_monitor_probe.py
