name: Capital Local Catalog Scan
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/local_catalog_scan.py"
      - ".github/workflows/local-catalog-scan.yml"
jobs:
  scan:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Load markets and scan local catalog artifacts
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python tools/local_catalog_scan.py
